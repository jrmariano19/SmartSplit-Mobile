<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartSplit Mobile Pro</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --border: #334155;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #10b981;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding: 15px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 480px; background: var(--card-bg); padding: 20px; border-radius: 20px; border: 1px solid var(--border); box-shadow: 0 10px 25px rgba(0,0,0,0.4); }
        h1 { font-size: 1.25rem; color: #818cf8; text-align: center; margin-bottom: 5px; }
        p.subtitle { text-align: center; color: var(--text-muted); font-size: 0.8rem; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-weight: 500; font-size: 0.85rem; }
        input[type="file"], input[type="number"], select {
            width: 100%; padding: 12px; background: #0f172a; border: 1px solid var(--border); border-radius: 10px; color: white; font-size: 0.9rem;
        }
        button.main-btn {
            background: var(--primary); color: white; border: none; padding: 14px; width: 100%; border-radius: 10px; font-weight: bold; font-size: 1rem; cursor: pointer; margin-top: 5px;
        }
        button.main-btn:active { background: var(--primary-hover); transform: scale(0.98); }
        .progress-box {
            margin-top: 15px; background: #090d16; padding: 12px; border-radius: 10px; border: 1px solid var(--border); font-size: 0.82rem; color: #38bdf8; display: none; word-break: break-word;
        }
        .results { margin-top: 20px; }
        .scene-card {
            background: rgba(255,255,255,0.03); border: 1px solid var(--border); padding: 12px; border-radius: 12px; margin-bottom: 12px;
        }
        .scene-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .scene-info h4 { font-size: 0.95rem; color: #e2e8f0; }
        .scene-info span { font-size: 0.8rem; color: #38bdf8; font-weight: bold; }
        .action-btns { display: flex; gap: 8px; margin-top: 10px; }
        .btn-small {
            flex: 1; padding: 8px 10px; border-radius: 8px; border: none; font-size: 0.8rem; font-weight: 600; cursor: pointer; color: white;
        }
        .btn-preview { background: #334155; }
        .btn-download { background: var(--accent); color: #052e16; }
        video#previewPlayer { width: 100%; border-radius: 10px; margin-top: 12px; display: none; background: #000; }
    </style>
</head>
<body>

<div class="container">
    <h1>SmartSplit Mobile</h1>
    <p class="subtitle">Análise real de cenas e divisão no navegador</p>

    <div class="form-group">
        <label for="videoFile">Selecione o vídeo longo:</label>
        <input type="file" id="videoFile" accept="video/*">
    </div>

    <div class="form-group">
        <label for="partsCount">Dividir em quantas partes?</label>
        <input type="number" id="partsCount" min="2" max="20" value="4">
    </div>

    <div class="form-group">
        <label for="mode">Critério de Deteção:</label>
        <select id="mode">
            <option value="scene">Mudança de Cena (Visual Inteligente)</option>
            <option value="equal">Duração Igual Exata</option>
        </select>
    </div>

    <button class="main-btn" onclick="iniciarAnalise()">Analisar e Dividir</button>

    <div id="progressBox" class="progress-box"></div>
    <video id="previewPlayer" controls playsinline></video>
    <div class="results" id="resultsContainer"></div>

    <canvas id="procCanvas" width="64" height="36" style="display:none;"></canvas>
</div>

<script>
    let currentVideoUrl = null;
    let stopTimeListener = null;

    function formatTime(sec) {
        const h = Math.floor(sec / 3600).toString().padStart(2, '0');
        const m = Math.floor((sec % 3600) / 60).toString().padStart(2, '0');
        const s = Math.floor(sec % 60).toString().padStart(2, '0');
        return `${h}:${m}:${s}`;
    }

    async function iniciarAnalise() {
        const fileInput = document.getElementById('videoFile');
        const partsCount = parseInt(document.getElementById('partsCount').value) || 4;
        const mode = document.getElementById('mode').value;
        const progressBox = document.getElementById('progressBox');
        const resultsContainer = document.getElementById('resultsContainer');
        const player = document.getElementById('previewPlayer');

        if (!fileInput.files || fileInput.files.length === 0) {
            alert('Por favor, selecione o ficheiro de vídeo primeiro.');
            return;
        }

        const file = fileInput.files[0];
        progressBox.style.display = 'block';
        progressBox.innerText = `A carregar "${file.name}" (${(file.size / 1048576).toFixed(1)} MB)...`;
        resultsContainer.innerHTML = '';

        try {
            if (currentVideoUrl) URL.revokeObjectURL(currentVideoUrl);
            currentVideoUrl = URL.createObjectURL(file);
            player.src = currentVideoUrl;
            player.style.display = 'block';

            await new Promise((resolve, reject) => {
                const timer = setTimeout(() => reject(new Error('Tempo limite excedido ao ler o vídeo.')), 8000);
                player.onloadedmetadata = () => { clearTimeout(timer); resolve(); };
                player.onerror = () => { clearTimeout(timer); reject(new Error('Não foi possível ler este formato de vídeo no navegador.')); };
            });

            const duration = player.duration;
            if (!Number.isFinite(duration) || duration <= 0) throw new Error('A duração do vídeo não pôde ser identificada.');
            const safePartsCount = Math.max(2, Math.min(20, partsCount));
            const interval = duration / safePartsCount;
            const cutPoints = [0];

            for (let i = 1; i < safePartsCount; i++) {
                let targetTime = i * interval;
                if (mode === 'scene') {
                    progressBox.innerText = `A analisar fotogramas para encontrar corte de cena ${i}/${safePartsCount - 1}...`;
                    targetTime = await findBestSceneCut(player, targetTime, duration);
                }
                cutPoints.push(targetTime);
            }
            cutPoints.push(duration);

            progressBox.innerText = `Análise concluída! Duração total: ${formatTime(duration)}`;
            renderizarResultados(cutPoints);

        } catch (err) {
            progressBox.innerText = `Aviso: ${err.message}`;
        }
    }

    async function findBestSceneCut(video, targetSec, totalDuration) {
        const canvas = document.getElementById('procCanvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const searchWindow = Math.min(4, totalDuration * 0.05);
        const startSearch = Math.max(0.5, targetSec - searchWindow);
        const endSearch = Math.min(totalDuration - 0.5, targetSec + searchWindow);
        const step = 0.5;

        let bestTime = targetSec;
        let maxDiff = -1;
        let prevData = null;

        for (let t = startSearch; t <= endSearch; t += step) {
            video.currentTime = t;
            await new Promise((resolve, reject) => {
                let done = false;
                const finish = (error) => {
                    if (done) return;
                    done = true;
                    clearTimeout(timer);
                    video.removeEventListener('seeked', onSeeked);
                    error ? reject(error) : resolve();
                };
                const onSeeked = () => finish();
                const timer = setTimeout(() => finish(new Error('Tempo limite ao analisar fotogramas.')), 2500);
                video.addEventListener('seeked', onSeeked, { once: true });
            });
            try {
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const frameData = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
                if (prevData) {
                    let diff = 0;
                    for (let j = 0; j < frameData.length; j += 16) {
                        diff += Math.abs(frameData[j] - prevData[j]);
                    }
                    if (diff > maxDiff) {
                        maxDiff = diff;
                        bestTime = t;
                    }
                }
                prevData = frameData;
            } catch (error) {
                throw new Error('O navegador bloqueou a leitura dos fotogramas deste vídeo.');
            }
        }
        return bestTime;
    }

    function renderizarResultados(cutPoints) {
        const container = document.getElementById('resultsContainer');
        let html = '<h3 style="font-size: 0.95rem; margin-bottom: 10px; color: #818cf8;">Cortes de Cena Detetados:</h3>';

        for (let i = 0; i < cutPoints.length - 1; i++) {
            const start = cutPoints[i];
            const end = cutPoints[i + 1];
            html += `
                <div class="scene-card">
                    <div class="scene-header">
                        <div class="scene-info">
                            <h4>Parte ${i + 1}</h4>
                            <span>${formatTime(start)} — ${formatTime(end)}</span>
                        </div>
                        <span style="font-size:0.75rem; color:#94a3b8;">Duração: ${Math.round(end - start)}s</span>
                    </div>
                    <div class="action-btns">
                        <button class="btn-small btn-preview" onclick="previsualizarParte(${start}, ${end})">▶️ Ver Parte ${i + 1}</button>
                        <button class="btn-small btn-download" onclick="gravarParte(${start}, ${end}, ${i + 1}, this)">💾 Extrair Vídeo</button>
                    </div>
                </div>
            `;
        }
        container.innerHTML = html;
    }

    function previsualizarParte(start, end) {
        const player = document.getElementById('previewPlayer');
        if (stopTimeListener) player.removeEventListener('timeupdate', stopTimeListener);
        player.currentTime = start;
        player.play();

        stopTimeListener = () => {
            if (player.currentTime >= end) {
                player.pause();
                player.removeEventListener('timeupdate', stopTimeListener);
            }
        };
        player.addEventListener('timeupdate', stopTimeListener);
    }

    async function gravarParte(start, end, partNum, btn) {
        const player = document.getElementById('previewPlayer');
        const capture = player.captureStream || player.mozCaptureStream;
        const stream = capture ? capture.call(player) : null;

        if (!stream || typeof MediaRecorder === 'undefined') {
            alert('Este navegador não oferece suporte à gravação direta do vídeo. Teste no Chrome atualizado ou num navegador compatível.');
            return;
        }

        const mimeType = ['video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm']
            .find(type => MediaRecorder.isTypeSupported(type));
        if (!mimeType) {
            alert('Este navegador não suporta exportação WebM pela API de gravação.');
            return;
        }

        const originalText = btn.innerText;
        btn.innerText = 'A extrair...';
        btn.disabled = true;

        const chunks = [];
        let recorder;
        try {
            recorder = new MediaRecorder(stream, { mimeType });
        } catch (error) {
            btn.innerText = originalText;
            btn.disabled = false;
            alert('Não foi possível iniciar a gravação neste navegador.');
            return;
        }

        recorder.ondataavailable = event => {
            if (event.data && event.data.size > 0) chunks.push(event.data);
        };

        recorder.onerror = () => {
            btn.innerText = originalText;
            btn.disabled = false;
            alert('Ocorreu um erro durante a extração.');
        };

        recorder.onstop = () => {
            const blob = new Blob(chunks, { type: mimeType });
            if (!blob.size) {
                alert('O navegador não gerou dados para esta parte.');
                btn.innerText = originalText;
                btn.disabled = false;
                return;
            }
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `parte_${partNum}.webm`;
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 60000);
            btn.innerText = 'Extração concluída';
            setTimeout(() => { btn.innerText = originalText; btn.disabled = false; }, 3000);
        };

        const finishRecording = () => {
            if (recorder.state !== 'inactive') recorder.stop();
            player.pause();
            player.removeEventListener('timeupdate', checkEnd);
        };

        const checkEnd = () => {
            if (player.currentTime >= end || player.ended) finishRecording();
        };

        try {
            player.pause();
            player.currentTime = start;
            await new Promise((resolve, reject) => {
                const timer = setTimeout(() => reject(new Error('Não foi possível posicionar o vídeo no início do corte.')), 5000);
                const onSeeked = () => { clearTimeout(timer); player.removeEventListener('seeked', onSeeked); resolve(); };
                player.addEventListener('seeked', onSeeked, { once: true });
            });
            player.addEventListener('timeupdate', checkEnd);
            recorder.start(250);
            await player.play();
            if (player.currentTime >= end) finishRecording();
        } catch (error) {
            if (recorder.state !== 'inactive') recorder.stop();
            player.removeEventListener('timeupdate', checkEnd);
            btn.innerText = originalText;
            btn.disabled = false;
            alert(error.message || 'Não foi possível reproduzir o vídeo para extração.');
        }
    }
</script>

</body>
</html>
